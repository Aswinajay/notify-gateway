# =====================================================================
# Render Blueprint Specification for OpenWA (Free Tier Optimized + R2 Sync)
# =====================================================================
# Requires a Render Persistent Disk mounted at /data for SQLite + sessions.
# R2 provides durable recovery snapshots — NOT a live filesystem.
# =====================================================================

services:
  - type: web
    name: openwa
    runtime: node
    plan: free
    region: oregon
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true npm ci && npm run build:all
    startCommand: node dist/main
    healthCheckPath: /api/health
    # Persistent disk for SQLite + Baileys session data
    disk:
      name: openwa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: HOST
        value: 0.0.0.0
      - key: ENGINE_TYPE
        value: baileys
      - key: OUTBOUND_ONLY
        value: "true"
      - key: LITE_MODE
        value: "true"
      - key: BAILEYS_SYNC_HISTORY
        value: "false"
      - key: BAILEYS_SYNC_FULL_HISTORY
        value: "false"
      - key: MEDIA_DOWNLOAD_ENABLED
        value: "false"
      - key: BAILEYS_MARK_ONLINE_ON_CONNECT
        value: "false"
      - key: BAILEYS_MESSAGE_STORE_LIMIT
        value: "50"
      - key: BAILEYS_SESSION_STORE_MAX_ENTRIES
        value: "100"
      # All data paths: absolute paths on persistent disk (/data)
      - key: DATABASE_TYPE
        value: sqlite
      - key: MAIN_DATABASE_NAME
        value: /data/main.sqlite
      - key: DATABASE_NAME
        value: /data/openwa.sqlite
      - key: SESSION_DATA_PATH
        value: /data/sessions
      - key: BAILEYS_AUTH_DIR
        value: /data/baileys
      - key: PLUGIN_STATE_DIR
        value: /data
      - key: BOOTSTRAP_KEY_FILE
        value: /data/.api-key
      - key: STORAGE_LOCAL_PATH
        value: /data/media
      # Bounded session startup: stagger by 3s, max 1 concurrent
      - key: AUTO_START_SESSIONS
        value: "true"
      - key: AUTOSTART_THROTTLE_MS
        value: "3000"
      - key: MAX_CONCURRENT_SESSIONS
        value: "1"
      # R2 sync (set these in Render dashboard, not here)
      # - R2_SYNC_ENABLED=true
      # - R2_BUCKET=openwa-snapshots
      # - R2_ENDPOINT=https://<account>.r2.cloudflarestorage.com
      # - R2_ACCESS_KEY_ID=<from Render secrets>
      # - R2_SECRET_ACCESS_KEY=<from Render secrets>
      - key: R2_SYNC_ENABLED
        value: "false"
      - key: R2_DEBOUNCE_MS
        value: "45000"
      - key: R2_MAX_RETAINED
        value: "2"
      # Memory-heavy optional services disabled
      - key: QUEUE_ENABLED
        value: "false"
      - key: REDIS_ENABLED
        value: "false"
      - key: CACHE_ENABLED
        value: "false"
      - key: SEARCH_ENABLED
        value: "false"
      - key: MCP_ENABLED
        value: "false"
      - key: SERVE_DASHBOARD
        value: "true"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: API_MASTER_KEY
        generateValue: true
